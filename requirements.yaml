name: wetlands
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip

  # Data: the joined AlphaEarth + NLCD parquet is read as a pyarrow dataset
  # (datasets.py, folds.py, population_stats.py, data_analysis.ipynb).
  - pyarrow=25.0.0
  - numpy=2.4.6
  - pandas=3.0.5

  # Model + training loop (models.py, datasets.py, train.py).
  - pytorch=2.13.0
  - pytorch-lightning=2.6.5
  - torchmetrics=1.9.0

  # Metrics and plots (reporting.py).
  - scikit-learn=1.9.0
  - matplotlib=3.11.1

  # Only needed to run data_analysis.ipynb.
  - ipykernel=7.3.0
  - jupyterlab=4.6.2
